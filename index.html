<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>德州撲克分析器</title>

<style>
:root{
  --bg:#0b1016;
  --panel:#141b24;
  --panel2:#1b2531;
  --line:#2b3848;
  --text:#f5f7fb;
  --muted:#9aa8b8;
  --green:#49d79f;
  --yellow:#f0c45a;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  background:linear-gradient(180deg,#090d12,#111923);
  color:var(--text);
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:14px 12px 40px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 2px 16px;
}

.brand{
  font-weight:900;
  font-size:22px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.badge{
  background:var(--green);
  color:#062015;
  font-size:12px;
  font-weight:900;
  padding:6px 10px;
  border-radius:999px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:13px;
}

h2{
  margin:0 0 12px;
  font-size:16px;
}

.cards{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.cardbtn{
  width:58px;
  height:78px;
  border-radius:11px;
  border:1px dashed #536274;
  background:#101720;
  color:#8190a0;
  font-size:30px;
  font-weight:800;
}

.cardbtn.filled{
  background:white;
  border-style:solid;
  color:#111;
  font-size:22px;
}

.cardbtn.red{
  color:#d82727;
}

.row,
.player-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

input,
select{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--line);
  color:white;
  padding:12px;
  border-radius:12px;
  font-size:16px;
}

.pills{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#101720;
  color:#dce4ec;
  font-size:13px;
}

.pill.active{
  border-color:var(--green);
  background:#10271f;
  color:var(--green);
}

.player{
  background:#101720;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-bottom:10px;
}

.player.folded{
  opacity:.5;
}

.player-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.player-title{
  font-size:16px;
  font-weight:900;
}

.player-state{
  font-size:11px;
  color:var(--muted);
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.actionbtn{
  border:1px solid var(--line);
  background:#18212b;
  color:#dce4ec;
  border-radius:10px;
  padding:10px 6px;
  font-size:12px;
}

.actionbtn.active{
  border-color:var(--green);
  background:#10271f;
  color:var(--green);
}

.btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:var(--green);
  color:#062015;
  font-size:17px;
  font-weight:900;
  margin-top:10px;
}

.btn.secondary{
  background:#202a36;
  color:#dce4ec;
  border:1px solid var(--line);
}

.summary{
  background:#101720;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  font-size:13px;
  line-height:1.65;
  color:#d4dde6;
}

.hidden{
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-height:85vh;
  overflow:auto;
  background:#131b24;
  border-radius:20px 20px 0 0;
  padding:16px 12px 24px;
}

.sheettop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.close{
  background:#253140;
  border:0;
  color:white;
  border-radius:10px;
  padding:8px 11px;
}

.deck{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.pick{
  background:white;
  color:#111;
  border:0;
  border-radius:10px;
  padding:12px 4px;
  font-size:18px;
  font-weight:900;
}

.pick.red{
  color:#d82727;
}

.pick.used{
  opacity:.2;
}

.street{
  font-size:11px;
  color:#718094;
  margin-top:5px;
}

.note{
  font-size:12px;
  line-height:1.55;
  color:var(--muted);
  border-left:3px solid var(--yellow);
  padding-left:10px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div>
      <div class="brand">德州撲克分析器</div>
      <div class="small">多人桌資料輸入測試版</div>
    </div>

    <div class="badge">v0.2</div>
  </div>


  <div class="panel">
    <h2>① 選擇桌型</h2>

    <div class="pills" id="tableType">
      <button class="pill active" data-table="6">6 人桌</button>
      <button class="pill" data-table="9">9 人桌</button>
    </div>
  </div>


  <div class="panel">
    <h2>② 我的手牌</h2>

    <div class="cards">
      <button class="cardbtn" data-slot="hero0">＋</button>
      <button class="cardbtn" data-slot="hero1">＋</button>
    </div>
  </div>


  <div class="panel">
    <h2>③ 公共牌</h2>

    <div class="cards">
      <button class="cardbtn" data-slot="board0">＋</button>
      <button class="cardbtn" data-slot="board1">＋</button>
      <button class="cardbtn" data-slot="board2">＋</button>
      <button class="cardbtn" data-slot="board3">＋</button>
      <button class="cardbtn" data-slot="board4">＋</button>
    </div>

    <div class="street">
      前三張＝翻牌｜第 4 張＝轉牌｜第 5 張＝河牌
    </div>
  </div>


  <div class="panel">
    <h2>④ 我的牌局資料</h2>

    <div class="row">

      <div>
        <label>我的位置</label>
        <select id="heroPos"></select>
      </div>

      <div>
        <label>我的有效籌碼</label>
        <input id="heroStack" type="number" value="5000">
      </div>

      <div>
        <label>目前底池</label>
        <input id="pot" type="number" value="1000">
      </div>

      <div>
        <label>本輪我已投入</label>
        <input id="heroInvested" type="number" value="0">
      </div>

    </div>
  </div>


  <div class="panel">

    <h2>⑤ 各玩家詳細資料</h2>

    <div class="small" style="margin-bottom:12px">
      選擇自己的位置後，該座位會自動從對手區移除。
    </div>

    <div id="playersContainer"></div>

  </div>


  <div class="panel">

    <button class="btn" id="collect">
      整理目前牌局資料
    </button>

    <button class="btn secondary" id="reset">
      全部重置
    </button>

  </div>


  <div class="panel hidden" id="summaryPanel">

    <h2>目前已輸入資料</h2>

    <div class="summary" id="summary"></div>

    <div class="note">
      目前先測試多人資料輸入。下一階段會加入牌力、Range、Equity、Outs、Pot Odds 與 EV 分析。
    </div>

  </div>

</div>


<div class="modal" id="modal">

  <div class="sheet">

    <div class="sheettop">
      <b>選擇一張牌</b>
      <button class="close" id="close">關閉</button>
    </div>

    <div class="deck" id="deck"></div>

  </div>

</div>


<script>

const seats6=[
  "UTG","HJ","CO","BTN","SB","BB"
];

const seats9=[
  "UTG","UTG+1","UTG+2","LJ","HJ","CO","BTN","SB","BB"
];

let tableSize=6;

let seats=[...seats6];

let playerState={};


const ranks=[
  "A","K","Q","J","10",
  "9","8","7","6","5","4","3","2"
];

const suits=[
  ["♠",false],
  ["♥",true],
  ["♦",true],
  ["♣",false]
];


const slots={

  hero0:null,
  hero1:null,

  board0:null,
  board1:null,
  board2:null,
  board3:null,
  board4:null

};


let currentSlot=null;

const modal=
document.getElementById("modal");

const deck=
document.getElementById("deck");


function defaultPlayer(seat){

  return {

    seat:seat,
    stack:5000,
    invested:0,
    raiseTo:0,
    type:"未知",
    action:"尚未行動"

  };

}


function resetPlayerState(){

  playerState={};

  seats.forEach(function(seat){

    playerState[seat]=
    defaultPlayer(seat);

  });

}


function buildHeroPositions(){

  const select=
  document.getElementById("heroPos");

  const old=
  select.value;

  select.innerHTML="";


  seats.forEach(function(seat){

    const option=
    document.createElement("option");

    option.value=seat;

    option.textContent=seat;

    select.appendChild(option);

  });


  if(seats.includes(old)){

    select.value=old;

  }


  renderPlayers();

}


function renderPlayers(){

  const container=
  document.getElementById(
    "playersContainer"
  );

  container.innerHTML="";


  const hero=
  document.getElementById(
    "heroPos"
  ).value;


  seats
  .filter(function(seat){

    return seat!==hero;

  })
  .forEach(function(seat){


    if(!playerState[seat]){

      playerState[seat]=
      defaultPlayer(seat);

    }


    const player=
    playerState[seat];


    const box=
    document.createElement("div");


    box.className=
    "player"+
    (
      player.action==="棄牌"
      ?" folded"
      :""
    );


    const types=[
      "未知",
      "偏緊",
      "一般",
      "偏鬆",
      "激進",
      "被動"
    ];


    const actions=[
      "過牌",
      "下注",
      "平跟",
      "加注",
      "All-in",
      "棄牌"
    ];


    box.innerHTML=`

      <div class="player-head">

        <div class="player-title">
          ${seat}
        </div>

        <div class="player-state">
          ${player.action}
        </div>

      </div>


      <div class="player-grid">

        <div>

          <label>
            剩餘籌碼
          </label>

          <input
          type="number"
          data-field="stack"
          value="${player.stack}">

        </div>


        <div>

          <label>
            本輪已投入
          </label>

          <input
          type="number"
          data-field="invested"
          value="${player.invested}">

        </div>


        <div>

          <label>
            加注到
          </label>

          <input
          type="number"
          data-field="raiseTo"
          value="${player.raiseTo}">

        </div>


        <div>

          <label>
            玩家類型
          </label>

          <select data-field="type">

            ${
              types.map(function(type){

                return `
                <option
                ${
                  type===player.type
                  ?"selected"
                  :""
                }>
                ${type}
                </option>
                `;

              }).join("")
            }

          </select>

        </div>

      </div>


      <div class="actions">

        ${
          actions.map(function(action){

            return `
            <button
            class="actionbtn
            ${
              action===player.action
              ?"active"
              :""
            }"
            data-action="${action}">
            ${action}
            </button>
            `;

          }).join("")
        }

      </div>

    `;


    box.querySelectorAll(
      "[data-field]"
    )
    .forEach(function(input){

      function save(){

        const field=
        input.dataset.field;


        if(
          input.tagName===
          "SELECT"
        ){

          playerState[seat][field]=
          input.value;

        }else{

          playerState[seat][field]=
          Number(input.value)||0;

        }

      }


      input.addEventListener(
        "input",
        save
      );


      input.addEventListener(
        "change",
        save
      );

    });


    box.querySelectorAll(
      ".actionbtn"
    )
    .forEach(function(button){

      button.onclick=function(){

        playerState[seat].action=
        button.dataset.action;

        renderPlayers();

      };

    });


    container.appendChild(box);

  });

}


function usedCards(){

  return Object
  .values(slots)
  .filter(Boolean);

}


function renderDeck(){

  deck.innerHTML="";


  suits.forEach(function(suitInfo){

    const suit=suitInfo[0];

    const red=suitInfo[1];


    ranks.forEach(function(rank){

      const card=
      rank+suit;


      const button=
      document.createElement("button");


      const isUsed=
      usedCards().includes(card)
      &&
      slots[currentSlot]!==card;


      button.className=
      "pick"+
      (red?" red":"")+
      (isUsed?" used":"");


      button.textContent=
      card;


      button.disabled=
      isUsed;


      button.onclick=function(){

        slots[currentSlot]=
        card;

        renderSlots();

        modal.classList.remove(
          "show"
        );

      };


      deck.appendChild(
        button
      );

    });

  });

}


function renderSlots(){

  document
  .querySelectorAll(
    ".cardbtn"
  )
  .forEach(function(button){

    const card=
    slots[
      button.dataset.slot
    ];


    button.textContent=
    card||"＋";


    button.className=
    "cardbtn"+
    (card?" filled":"")+
    (
      card &&
      (
        card.includes("♥")
        ||
        card.includes("♦")
      )
      ?" red"
      :""
    );

  });

}


document
.querySelectorAll(
  ".cardbtn"
)
.forEach(function(button){

  button.onclick=function(){

    currentSlot=
    button.dataset.slot;

    renderDeck();

    modal.classList.add(
      "show"
    );

  };

});


document
.getElementById(
  "close"
)
.onclick=function(){

  modal.classList.remove(
    "show"
  );

};


modal.onclick=function(event){

  if(event.target===modal){

    modal.classList.remove(
      "show"
    );

  }

};


document
.querySelectorAll(
  "#tableType .pill"
)
.forEach(function(button){

  button.onclick=function(){

    document
    .querySelectorAll(
      "#tableType .pill"
    )
    .forEach(function(x){

      x.classList.remove(
        "active"
      );

    });


    button.classList.add(
      "active"
    );


    tableSize=
    Number(
      button.dataset.table
    );


    seats=
    tableSize===6
    ?[...seats6]
    :[...seats9];


    resetPlayerState();

    buildHeroPositions();


    document
    .getElementById(
      "summaryPanel"
    )
    .classList.add(
      "hidden"
    );

  };

});


document
.getElementById(
  "heroPos"
)
.addEventListener(
  "change",
  renderPlayers
);


document
.getElementById(
  "collect"
)
.onclick=function(){


  const heroCards=[
    slots.hero0,
    slots.hero1
  ].filter(Boolean);


  const board=[
    slots.board0,
    slots.board1,
    slots.board2,
    slots.board3,
    slots.board4
  ].filter(Boolean);


  const hero=
  document
  .getElementById(
    "heroPos"
  ).value;


  const activeOpponents=
  seats
  .filter(function(seat){

    return seat!==hero;

  })
  .filter(function(seat){

    return (
      playerState[seat].action
      !==
      "棄牌"
    );

  });


  const lines=[];


  lines.push(
    "桌型："+tableSize+" 人桌"
  );


  lines.push(
    "我的位置："+hero
  );


  lines.push(
    "我的手牌："+
    (
      heroCards.length
      ?heroCards.join("、")
      :"尚未輸入"
    )
  );


  lines.push(
    "公共牌："+
    (
      board.length
      ?board.join("、")
      :"尚未輸入"
    )
  );


  lines.push(
    "目前底池："+
    (
      Number(
        document
        .getElementById(
          "pot"
        ).value
      )
      ||0
    )
  );


  lines.push(
    "我的有效籌碼："+
    (
      Number(
        document
        .getElementById(
          "heroStack"
        ).value
      )
      ||0
    )
  );


  lines.push(
    "本輪我已投入："+
    (
      Number(
        document
        .getElementById(
          "heroInvested"
        ).value
      )
      ||0
    )
  );


  lines.push(
    "仍在牌局中的對手："+
    activeOpponents.length+
    " 人"
  );


  lines.push("");

  lines.push(
    "各對手資料："
  );


  seats
  .filter(function(seat){

    return seat!==hero;

  })
  .forEach(function(seat){

    const player=
    playerState[seat];


    let text=

    seat+
    "｜籌碼 "+
    player.stack+
    "｜已投入 "+
    player.invested+
    "｜動作 "+
    player.action;


    if(
      player.action===
      "加注"
    ){

      text+=
      "｜加注到 "+
      player.raiseTo;

    }


    text+=
    "｜類型 "+
    player.type;


    lines.push(
      text
    );

  });


  document
  .getElementById(
    "summary"
  )
  .innerHTML=
  lines.join("<br>");


  document
  .getElementById(
    "summaryPanel"
  )
  .classList.remove(
    "hidden"
  );


  document
  .getElementById(
    "summaryPanel"
  )
  .scrollIntoView({
    behavior:"smooth"
  });

};


document
.getElementById(
  "reset"
)
.onclick=function(){

  Object
  .keys(slots)
  .forEach(function(key){

    slots[key]=null;

  });


  renderSlots();


  tableSize=6;

  seats=[...seats6];


  document
  .querySelectorAll(
    "#tableType .pill"
  )
  .forEach(function(x){

    x.classList.remove(
      "active"
    );

  });


  document
  .querySelector(
    '#tableType .pill[data-table="6"]'
  )
  .classList.add(
    "active"
  );


  document
  .getElementById(
    "heroStack"
  ).value=5000;


  document
  .getElementById(
    "pot"
  ).value=1000;


  document
  .getElementById(
    "heroInvested"
  ).value=0;


  resetPlayerState();

  buildHeroPositions();


  document
  .getElementById(
    "summaryPanel"
  )
  .classList.add(
    "hidden"
  );

};


resetPlayerState();

buildHeroPositions();

renderSlots();

</script>

</body>
</html>
